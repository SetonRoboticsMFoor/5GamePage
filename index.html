<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0f0d">
  <title>Neon Coil | Snake</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <header class="masthead">
      <div>
        <p class="eyebrow">Arcade / 001</p>
        <h1>Neon Coil</h1>
      </div>
      <div class="header-tools">
        <label for="theme">Theme</label>
        <select id="theme" aria-label="Choose color theme">
          <option value="lime">Neon Lime</option>
          <option value="ocean">Electric Ocean</option>
          <option value="ember">Hot Ember</option>
        </select>
        <p class="intro">Eat the bright fruit. Grow with every bite. Keep your cool when the walls close in.</p>
      </div>
    </header>

    <section class="game-layout" aria-label="Snake game">
      <div class="board-frame">
        <div class="status" id="status">READY</div>
        <canvas id="game" width="600" height="600" aria-label="Snake game board"></canvas>
      </div>
      <aside class="sidebar">
        <div class="score-panel">
          <span>Current score</span>
          <strong id="score">000</strong>
          <small>Best: <b id="best">000</b></small>
        </div>
        <div class="controls"><span>MOVE</span> Arrow keys or WASD<br><span>PAUSE</span> Spacebar</div>
        <button id="start" type="button">START GAME</button>
        <p class="hint">Your best run is saved in this browser.</p>
      </aside>
    </section>
  </main>
  <script src="game.js"></script>
</body>
</html>
